<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}
.banner {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    height: 90px;
    overflow: hidden;
    isolation: isolate;
    border: 2px solid #00d9ff;
    border-radius: 15px;
    background: linear-gradient(
        110deg,
        #020a29,
        #082a78,
        #1248a8,
        #06194c,
        #020a29
    );
    background-size: 250% 100%;
    animation: blueGlow 9s ease infinite;
    box-shadow:
        0 0 12px #00aaff,
        inset 0 0 18px rgba(0, 180, 255, 0.25);
}
/* Moving blue background */
@keyframes blueGlow {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}
/* STAR LAYER */
.stars {
    position: absolute;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
}
.star {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow:
        0 0 5px #ffffff,
        0 0 10px #00d9ff,
        0 0 16px #00aaff;
    animation: twinkle 2s ease-in-out infinite alternate;
}
@keyframes twinkle {
    from {
        opacity: 0.15;
        transform: scale(0.5);
    }
    to {
        opacity: 1;
        transform: scale(1.7);
    }
}
/* Glowing moving particles */
.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #64f5ff;
    box-shadow: 0 0 10px 3px #008cff;
    animation: particleMove 7s linear infinite;
}
@keyframes particleMove {
    from {
        transform: translateX(0);
        opacity: 0;
    }
    15% { opacity: 1; }
    85% { opacity: 0.8; }
    to {
        transform: translateX(220px);
        opacity: 0;
    }
}
/* LIVE BOX */
.live {
    flex: 0 0 auto;
    padding: 14px 17px;
    background: linear-gradient(135deg, #ff1744, #bd002e);
    color: white;
    font-size: clamp(15px, 2.2vw, 22px);
    font-weight: 900;
    white-space: nowrap;
    box-shadow: 0 0 15px rgba(255, 0, 55, 0.4);
}
.live-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-right: 5px;
    border-radius: 50%;
    background: white;
    animation: livePulse 1s infinite;
}
@keyframes livePulse {
    50% { opacity: 0.25; }
}
/* CHANNEL NAME */
.logo {
    flex: 0 0 auto;
    padding: 0 16px;
    font-size: clamp(14px, 2.6vw, 27px);
    font-weight: 900;
    color: #ffffff;
    white-space: nowrap;
    text-shadow: 0 0 8px rgba(0, 150, 255, 0.6);
}
.logo span {
    color: #40eaff;
}
/* SCROLLING TEXT */
.scroll {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
}
.scroll-text {
    display: inline-block;
    flex-shrink: 0;
    padding-left: 100%;
    font-size: clamp(12px, 1.8vw, 19px);
    font-weight: bold;
    color: #ffffff;
    animation: textScroll 24s linear infinite;
    text-shadow: 0 0 8px #168cff;
}
@keyframes textScroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
}
/* SUBSCRIBE BUTTON */
.subscribe {
    flex: 0 0 auto;
    margin-right: 7px;
    padding: 13px 14px;
    border-radius: 5px;
    background: linear-gradient(135deg, #ffe45c, #ffb900);
    color: #071744;
    font-size: clamp(10px, 1.5vw, 15px);
    font-weight: 900;
    white-space: nowrap;
    box-shadow: 0 0 12px rgba(255, 204, 0, 0.3);
}
/* MOBILE LAYOUT */
@media (max-width: 600px) {
    .banner {
        height: 72px;
        border-radius: 10px;
    }
    .live {
        padding: 12px 8px;
        font-size: 14px;
    }
    .live-dot {
        width: 6px;
        height: 6px;
        margin-right: 3px;
    }
    .logo {
        padding: 0 8px;
        font-size: clamp(12px, 3.1vw, 19px);
    }
    .scroll-text {
        font-size: 12px;
        animation-duration: 22s;
    }
    .subscribe {
        margin-right: 4px;
        padding: 10px 6px;
        font-size: 9px;
    }
}
@media (max-width: 360px) {
    .live {
        padding: 10px 5px;
        font-size: 12px;
    }
    .logo {
        padding: 0 5px;
        font-size: 11px;
    }
    .subscribe {
        padding: 9px 4px;
        font-size: 8px;
    }
}
</style>
</head>
<body>
<div class="banner">
    <!-- Animated Stars -->
    <div class="stars" id="stars"></div>
    <!-- Moving Particles -->
    <div class="particle" style="top:20%; left:-10px;"></div>
    <div class="particle" style="top:75%; left:20%; animation-delay:2s;"></div>
    <div class="particle" style="top:40%; left:55%; animation-delay:4s;"></div>
    <!-- LIVE -->
    <div class="live">
        <span class="live-dot"></span>LIVE
    </div>
    <!-- Channel Name -->
    <div class="logo">
        GURBANI RAS <span>LIVE</span>
    </div>
    <!-- Scrolling Text -->
    <div class="scroll">
        <div class="scroll-text">
            🙏 GURUDWARA SRI GURU TEGH BAHADUR SAHIB JI
            ✦ FARASHI TOLA, BAREILLY ✦
            WAHEGURU JI KA KHALSA, WAHEGURU JI KI FATEH
            ✦ LIVE GURBANI KIRTAN ✦
            PLEASE LIKE, SHARE & SUBSCRIBE 🙏
        </div>
    </div>
    <!-- Subscribe -->
    <div class="subscribe">
        ▶ SUBSCRIBE
    </div>
</div>
<script>
const starContainer = document.getElementById("stars");
for (let i = 0; i < 65; i++) {
    const star = document.createElement("span");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 3 + "s";
    star.style.animationDuration =
        (1 + Math.random() * 2.5) + "s";
    const size = 1 + Math.random() * 2.5;
    star.style.width = size + "px";
    star.style.height = size + "px";
    starContainer.appendChild(star);
}
</script>
</body>
</html>
